<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de imágenes — Estudio CTAPO</title>
  <meta name="description" content="Galería de avances de los videojuegos de Estudio CTAPO: arte, capturas de pantalla y progreso de desarrollo.">

  <link rel="icon" href="../img/logo/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/galeria.css">
</head>
<body>

  <!-- ============ HEADER / NAVEGACIÓN ============ -->
  <header>
    <div class="container header-container">
      <a href="../index.html" class="logo">
        <img src="../img/logo/logo.svg" alt="Estudio CTAPO" width="180" height="55">
      </a>

      <button id="navToggle" class="nav-toggle-btn" aria-expanded="false" aria-controls="primaryNav" aria-label="Abrir menú de navegación">
        <span></span><span></span><span></span>
      </button>

      <nav id="primaryNav" class="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="equipo.html">Equipo</a></li>
          <li><a href="galeria.html">Galería</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <!-- HERO INTERNO -->
    <section class="page-hero">
      <div class="container hero-content">
        <p class="eyebrow reveal">Galería</p>
        <h1 class="reveal">algunas imágenes de nuestro equipo y desarrollo</h1>
        <p class="reveal">
          Arte, capturas de pantalla y progreso de desarrollo.
          conocenos un poco más </p>
      </div>
    </section>

    <!-- ============ GALERÍA ============
         El contenido de .gallery-grid se genera con JS (js/galeria.js)
         a partir del array GALERIA_ITEMS: para agregar una imagen
         "definitiva" a la galería, sumá un objeto a ese array. -->
    <section class="gallery section-padding">
      <div class="container">
        <div class="gallery-filters reveal" id="galleryFilters">
          <!-- Los botones de filtro se generan dinámicamente según las categorías -->
        </div>

        <div class="gallery-grid" id="galleryGrid" aria-live="polite">
          <!-- Las imágenes se insertan acá por JS -->
        </div>
      </div>
    </section>

  </main>

  <!-- ============ LIGHTBOX (imagen ampliada) ============ -->
  <div class="lightbox" id="imageLightbox" hidden>
    <div class="lightbox-backdrop" data-close-lightbox></div>
    <button type="button" class="lightbox-close" data-close-lightbox aria-label="Cerrar">&times;</button>
    <button type="button" class="lightbox-nav lightbox-nav--prev" id="lightboxPrev" aria-label="Imagen anterior">‹</button>
    <img class="lightbox-content" id="lightboxImage" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
    <button type="button" class="lightbox-nav lightbox-nav--next" id="lightboxNext" aria-label="Imagen siguiente">›</button>
  </div>

  <!-- ============ FOOTER (compacto) ============ -->
  <footer>
    <div class="container">
      <div class="footer-content">
        <a href="../index.html" class="footer-brand">
          <img src="../img/logo/logo.svg" alt="Estudio CTAPO">
        </a>
        <nav class="footer-links" aria-label="Enlaces del pie de página">
          <a href="equipo.html">Equipo</a>
          <a href="galeria.html">Galería</a>
          <a href="contacto.html">Contacto</a>
        </nav>
        <div class="footer-social">
          <a href="mailto:ctapoproducciones@gmail.com" aria-label="Enviar un email">
            <svg viewBox="0 0 24 24"><path d="M2 4h20v16H2V4zm2 2v.5l8 5 8-5V6H4zm16 3.2-8 5-8-5V18h16V9.2z"/></svg>
          </a>

      </div>
      <div class="footer-bottom">
        <p>&copy; <span id="currentYear">2026</span> Estudio CTAPO. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="../js/main.js" defer></script>
  <script src="../js/galeria.js" defer></script>
</body>
</html>
